x-bootstrap-build: &bootstrap-build
  context: ../../..
  dockerfile: examples/tutorials/customer_support_copilot/contextforge/Dockerfile.bootstrap

services:
  runtime-init:
    build: *bootstrap-build
    command: ["/bin/bash", "/workspace/scripts/init_tutorial_contextforge_runtime.sh"]
    restart: "no"
    volumes:
      - tutorial-runtime:/runtime

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.4
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        . /runtime/secrets.env
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$${A2A_TUTORIAL_CONTEXTFORGE_ADMIN_PASSWORD}"
        exec /opt/keycloak/bin/kc.sh start-dev --import-realm \
          --https-certificate-file=/runtime/tls/keycloak.crt \
          --https-certificate-key-file=/runtime/tls/keycloak.key \
          --https-port=8443 --http-enabled=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_HOSTNAME: https://keycloak:8443
    depends_on:
      runtime-init: {condition: service_completed_successfully}
    volumes:
      - tutorial-runtime:/runtime:ro
      - ./contextforge/keycloak-realm.json:/opt/keycloak/data/import/a2a-tutorial-realm.json:ro
    ports: ["8443:8443"]

  keycloak-ready:
    build: *bootstrap-build
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        for attempt in $$(seq 1 120); do
          curl --fail --silent --cacert /runtime/tls/ca.crt \
            https://keycloak:8443/realms/a2a-tutorial/.well-known/openid-configuration >/dev/null && exit 0
          sleep 1
        done
        echo 'Timed out waiting for HTTPS Keycloak' >&2
        exit 1
    depends_on:
      keycloak: {condition: service_started}
    volumes:
      - tutorial-runtime:/runtime:ro

  contextforge:
    image: ghcr.io/ibm/mcp-context-forge:v1.0.10
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        source /runtime/secrets.env
        export JWT_SECRET_KEY="$${A2A_TUTORIAL_CONTEXTFORGE_JWT_SECRET}"
        export AUTH_ENCRYPTION_SECRET="$${A2A_TUTORIAL_CONTEXTFORGE_AUTH_ENCRYPTION_SECRET}"
        export DEFAULT_USER_PASSWORD="$${A2A_TUTORIAL_CONTEXTFORGE_ADMIN_PASSWORD}"
        export PLATFORM_ADMIN_PASSWORD="$${A2A_TUTORIAL_CONTEXTFORGE_ADMIN_PASSWORD}"
        export SSO_KEYCLOAK_CLIENT_SECRET="$${A2A_TUTORIAL_CONTEXTFORGE_OIDC_SECRET}"
        exec ./docker-entrypoint.sh
    environment:
      HOST: 0.0.0.0
      DATABASE_URL: sqlite:///./mcp.db
      # ContextForge's trusted-provider cache is process-local. The tutorial updates
      # Keycloak trust dynamically, so one worker keeps auth deterministic in CI.
      GUNICORN_WORKERS: "1"
      LEGACY_API_ENABLED: "false"
      LOG_LEVEL: WARNING
      AUTH_REQUIRED: "true"
      MCP_CLIENT_AUTH_ENABLED: "true"
      MCP_REQUIRE_AUTH: "true"
      TRANSPORT_TYPE: streamablehttp
      MCP_INBOUND_PROTOCOL_MODE: auto
      SSO_ENABLED: "true"
      SSO_KEYCLOAK_ENABLED: "true"
      SSO_API_TOKEN_AUTH_ENABLED: "true"
      SSO_AUTO_CREATE_USERS: "true"
      SSO_PRESERVE_ADMIN_AUTH: "true"
      # CI/tutorial-only: Keycloak intentionally runs on this isolated private Docker network.
      # Production deployments should allow private IdPs only when explicitly required and controlled.
      SSRF_ALLOW_PRIVATE_NETWORKS: "true"
      # This tutorial has only one trusted gateway DNS name; do not allow arbitrary UAID domains.
      UAID_ALLOWED_DOMAINS: '["contextforge"]'
      SSL_CERT_FILE: /runtime/tls/ca.crt
      PLATFORM_ADMIN_EMAIL: admin@example.com
      SSO_KEYCLOAK_BASE_URL: https://keycloak:8443
      SSO_KEYCLOAK_REALM: a2a-tutorial
      SSO_KEYCLOAK_CLIENT_ID: mcp-gateway
    depends_on:
      keycloak-ready: {condition: service_completed_successfully}
    volumes:
      - tutorial-runtime:/runtime:ro
    ports: ["4444:4444"]

  contextforge-bootstrap:
    build: *bootstrap-build
    entrypoint: ["/bin/bash", "-ec"]
    command:
      - |
        source /runtime/secrets.env
        export A2A_TUTORIAL_CA_CERT=/runtime/tls/ca.crt
        export A2A_TUTORIAL_MCP_ENV_FILE=/mcp/mcp.env
        export A2A_TUTORIAL_CONTEXTFORGE_URL=http://contextforge:4444
        export A2A_TUTORIAL_KEYCLOAK_URL=https://keycloak:8443
        /workspace/scripts/bootstrap_tutorial_contextforge.sh
        /workspace/scripts/verify_tutorial_contextforge.sh
    depends_on:
      contextforge: {condition: service_healthy}
    volumes:
      - tutorial-runtime:/runtime:ro
      - tutorial-mcp:/mcp

  support-specialist:
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -a
        . /mcp/mcp.env
        set +a
        exec /opt/tutorial/support_specialist 0.0.0.0:8181
    depends_on:
      contextforge-bootstrap: {condition: service_completed_successfully}
    volumes:
      - tutorial-mcp:/mcp:ro

  support-smoke:
    build: {context: ../../.., dockerfile: examples/tutorials/customer_support_copilot/Dockerfile}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/tutorial/support_client \
          --coordinator-url http://support-coordinator:8180 \
          --ticket-resource ticket://northstar/billing-currency > /tmp/support-smoke.out
        cat /tmp/support-smoke.out
        grep -Fq billing /tmp/support-smoke.out
    depends_on:
      support-coordinator: {condition: service_healthy}

volumes:
  tutorial-runtime:
  tutorial-mcp:
