x-model-environment: &model-environment
  A2A_TUTORIAL_MODEL_PROVIDER: "${A2A_TUTORIAL_MODEL_PROVIDER:-deterministic}"
  A2A_TUTORIAL_MODEL_BASE_URL: "${A2A_TUTORIAL_MODEL_BASE_URL:-}"
  A2A_TUTORIAL_MODEL_NAME: "${A2A_TUTORIAL_MODEL_NAME:-}"
  A2A_TUTORIAL_MODEL_API_KEY: "${A2A_TUTORIAL_MODEL_API_KEY:-}"
  A2A_TUTORIAL_MODEL_TIMEOUT_MS: "${A2A_TUTORIAL_MODEL_TIMEOUT_MS:-30000}"

services:
  profile-analyst:
    build: {context: ../../.., dockerfile: examples/tutorials/job_application_assistant/Dockerfile}
    command: ["/opt/tutorial/profile_analyst", "0.0.0.0:8081"]
    healthcheck: {test: ["CMD", "wget", "-q", "-T", "1", "-O", "/dev/null", "http://127.0.0.1:8081/.well-known/agent-card.json"], interval: 2s, timeout: 1s, retries: 20}
    environment:
      <<: *model-environment
      A2A_TUTORIAL_PUBLIC_URL: "http://profile-analyst:8081/a2a"
    extra_hosts: ["host.docker.internal:host-gateway"]
  application-coordinator:
    build: {context: ../../.., dockerfile: examples/tutorials/job_application_assistant/Dockerfile}
    command: ["/opt/tutorial/application_coordinator", "0.0.0.0:8080"]
    healthcheck: {test: ["CMD", "wget", "-q", "-T", "1", "-O", "/dev/null", "http://127.0.0.1:8080/.well-known/agent-card.json"], interval: 2s, timeout: 1s, retries: 20}
    environment:
      <<: *model-environment
      A2A_TUTORIAL_SPECIALIST_URL: "http://profile-analyst:8081"
      A2A_TUTORIAL_PUBLIC_URL: "http://application-coordinator:8080/a2a"
    depends_on:
      profile-analyst: {condition: service_healthy}
    ports: ["8080:8080"]
    extra_hosts: ["host.docker.internal:host-gateway"]
  application-smoke:
    build: {context: ../../.., dockerfile: examples/tutorials/job_application_assistant/Dockerfile}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        /opt/tutorial/application_client \
          --coordinator-url http://application-coordinator:8080 \
          --resume-file samples/resume.txt \
          --job-file samples/job_description.txt > /tmp/application-smoke.out
        cat /tmp/application-smoke.out
        grep -Fq "Application draft" /tmp/application-smoke.out
    depends_on:
      application-coordinator: {condition: service_healthy}
