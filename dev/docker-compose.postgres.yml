services:
  postgres:
    image: postgres:16
    container_name: a2a-cpp-postgres
    environment:
      POSTGRES_DB: a2a
      POSTGRES_USER: a2a
      POSTGRES_PASSWORD: a2a
    ports:
      - "5432:5432"
    volumes:
      - a2a_cpp_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U a2a -d a2a"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  a2a_cpp_postgres_data:
