name: Integrated release regression

on:
  workflow_dispatch:
    inputs:
      baseline:
        description: 'Baseline ref (resolved full commit recorded in results)'
        default: v0.5.2
        type: string
      requests:
        description: 'Samples per coordinate (at least 64)'
        default: '1024'
        type: string
      repetitions:
        description: 'Independent repetitions'
        default: '3'
        type: string

permissions:
  contents: read

jobs:
  linux-wire:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: a2a
          POSTGRES_PASSWORD: a2a
          POSTGRES_DB: a2a
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U a2a -d a2a"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      A2A_TEST_POSTGRES_DSN: postgresql://a2a:a2a@127.0.0.1:5432/a2a
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.baseline }}
          path: work/baseline
      - name: Install equal dependencies
        run: |
          ./scripts/install_build_deps.sh
          cmake -DA2A_BOOST_INSTALL_PREFIX="$RUNNER_TEMP/a2a-deps" -P cmake/InstallBoost.cmake
          cmake -DA2A_SIMDJSON_INSTALL_PREFIX="$RUNNER_TEMP/a2a-deps" -P cmake/InstallSimdjson.cmake
      - name: Build optimized baseline and candidate
        run: |
          cmake -S work/baseline -B work/build-baseline -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DA2A_ENABLE_TESTING=ON -DA2A_ENABLE_POSTGRES_STORE=ON \
            -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/a2a-deps"
          cmake --build work/build-baseline --parallel 2 --target tck_sut
          cmake -S . -B work/build-release -G Ninja \
            -DCMAKE_BUILD_TYPE=Release -DA2A_ENABLE_TESTING=ON -DA2A_ENABLE_POSTGRES_STORE=ON \
            -DA2A_ENABLE_ASIO=ON -DCMAKE_PREFIX_PATH="$RUNNER_TEMP/a2a-deps"
          cmake --build work/build-release --parallel 2 --target \
            tck_sut tck_async_sut a2a_wire_performance_driver async_unary_benchmark \
            event_http_server_test async_push_delivery_evidence
      - name: Run integrated comparison
        env:
          REQUESTS: ${{ inputs.requests }}
          REPETITIONS: ${{ inputs.repetitions }}
        run: |
          python3 tests/performance/release_validation.py \
            --baseline-build work/build-baseline --candidate-build work/build-release \
            --requests "$REQUESTS" --repetitions "$REPETITIONS" --output work/release-validation
          work/build-release/tests/event_http_server_test
          work/build-release/tests/async_push_delivery_evidence > work/release-validation/push.json
          cat work/release-validation/comparison.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: integrated-release-regression
          path: work/release-validation/
