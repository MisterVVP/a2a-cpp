name: Apply PR 147 follow-up

on:
  push:
    branches:
      - dev-fix-unresolved-review-threads-in-pr-#145
    paths:
      - scripts/apply_pr147_followup.py
      - .github/workflows/apply-pr147-followup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply follow-up changes
        run: python3 scripts/apply_pr147_followup.py
      - name: Format touched C++ files
        run: |
          clang-format -i \
            src/http/http_client.cpp \
            src/client/http_json_transport.cpp \
            src/client/json_rpc_transport.cpp \
            tests/unit/http_client_test.cpp \
            tests/integration/http_json_streaming_integration_test.cpp \
            tests/unit/json_rpc_transport_test.cpp
      - name: Commit changes
        run: |
          rm scripts/apply_pr147_followup.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/http/http_client.cpp \
                  src/client/http_json_transport.cpp \
                  src/client/json_rpc_transport.cpp \
                  tests/unit/http_client_test.cpp \
                  tests/integration/http_json_streaming_integration_test.cpp \
                  tests/unit/json_rpc_transport_test.cpp \
                  scripts/apply_pr147_followup.py
          git commit -m "Fix empty SSE metadata validation and expand coverage"
          git push
