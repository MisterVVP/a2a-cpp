name: CI

on:
  workflow_dispatch:
    inputs:
      profiling:
        description: 'Enable clang-tidy check profiling and upload its artifact'
        required: false
        default: false
        type: boolean
      clang_tidy_profile:
        description: 'clang-tidy profile to run'
        required: false
        default: 'split'
        type: choice
        options:
          - split
          - strict
  schedule:
    - cron: '17 4 * * 1'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - 'book/**'
      - '**/*.md'
      - '.github/workflows/docs.yml'
      - 'LICENSE'
      - '.gitignore'
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - 'book/**'
      - '**/*.md'
      - '.github/workflows/docs.yml'
      - 'LICENSE'
      - '.gitignore'

jobs:
  build-lint-test:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: a2a
          POSTGRES_PASSWORD: a2a
          POSTGRES_DB: a2a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U a2a -d a2a"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CLANG_TIDY_PROFILE: ${{ github.event_name == 'schedule' && 'strict' || (github.event_name == 'workflow_dispatch' && inputs.clang_tidy_profile || 'split') }}
      CLANG_TIDY_ENABLE_CHECK_PROFILE: ${{ github.event_name == 'workflow_dispatch' && inputs.profiling && '1' || '0' }}
      A2A_TEST_POSTGRES_DSN: postgresql://a2a:a2a@127.0.0.1:5432/a2a
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install deps
        run: |
          ./scripts/install_build_deps.sh
          python3 -m pip install --upgrade gcovr
      - name: Check formatting
        run: |
          mapfile -t CPP_FILES < <(git ls-files '*.h' '*.hpp' '*.c' '*.cpp')
          if [ "${#CPP_FILES[@]}" -gt 0 ]; then
            clang-format --dry-run --Werror "${CPP_FILES[@]}"
          fi
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCMAKE_EXPORT_COMPILE_COMMANDS=ON \
            -DA2A_ENABLE_TESTING=ON \
            -DA2A_ENABLE_POSTGRES_STORE=ON
      - name: Build
        run: cmake --build build -j"$(nproc)"
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Run clang-tidy on changed files with fast profile
        if: github.event_name == 'pull_request'
        run: ./scripts/run_clang_tidy_changed.sh origin/${{ github.base_ref }} build
      - name: Run clang-tidy on all source files with fast profile
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.clang_tidy_profile == 'split')
        run: ./scripts/run_clang_tidy.sh --profile split build
      - name: Run full strict clang-tidy on all files
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.clang_tidy_profile == 'strict')
        run: ./scripts/run_clang_tidy.sh --profile strict build

      - name: Upload clang-tidy check profile artifact
        if: always() && github.event_name == 'workflow_dispatch' && inputs.profiling
        uses: actions/upload-artifact@v6
        with:
          name: clang-tidy-check-profile
          path: |
            build/clang-tidy-check-profile*.txt
          if-no-files-found: warn


  performance-tests:
    name: performance tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Run report-only performance smoke suite
        env:
          A2A_PERF_TRANSPORTS: grpc,jsonrpc,http_json
          A2A_PERF_STORE_BACKENDS: inmemory
          A2A_PERF_REQUESTS: 1000
          A2A_PERF_CONCURRENCY: 1,4
          A2A_PERF_WARMUP_SECONDS: 0
          A2A_PERF_REPORT_DIR: perf-artifacts
        run: ./scripts/run_performance_tests.sh
      - name: Validate performance reports
        run: |
          test -s perf-artifacts/results.json
          test -s perf-artifacts/results.csv
          test -s perf-artifacts/summary.md
          python3 -m json.tool perf-artifacts/results.json >/dev/null
          cat perf-artifacts/summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload performance artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: perf-artifacts
          path: perf-artifacts
          if-no-files-found: error


  benchmarks:
    name: benchmarks
    runs-on: ubuntu-24.04
    env:
      A2A_BENCHMARK_THREADS: 4
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: |
          ./scripts/install_build_deps.sh
          sudo apt-get install -y --no-install-recommends golang-go
      - name: Configure benchmark build
        run: |
          cmake -S . -B build-bench -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_CXX_FLAGS_RELEASE='-O3 -DNDEBUG' \
            -DA2A_BUILD_BENCHMARKS=ON \
            -DA2A_BENCHMARK_USE_SYSTEM_BENCHMARK=OFF \
            -DA2A_ENABLE_TESTING=OFF \
            -DA2A_BUILD_EXAMPLES=OFF
      - name: Build benchmarks
        run: cmake --build build-bench --target a2a_benchmarks --parallel
      - name: Run benchmarks
        run: |
          ./build-bench/benchmarks/a2a_benchmarks \
            --benchmark_out=benchmark-results.json \
            --benchmark_out_format=json \
            --benchmark_repetitions=5 \
            --benchmark_report_aggregates_only=true \
            | tee benchmark-output.log
      - name: Check benchmark thresholds
        run: |
          go run ./tools/bench_runner/cmd/a2a-bench-runner \
            --results benchmark-results.json \
            --thresholds benchmarks/thresholds.json \
            --summary benchmark-summary.md
          cat benchmark-summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload benchmark artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: benchmark-results
          path: |
            benchmark-results.json
            benchmark-summary.md
            benchmark-output.log
          if-no-files-found: warn

  examples-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: ./scripts/install_build_deps.sh
      - name: Run example apps smoke
        run: ./scripts/run_examples.sh build-examples

  coverage:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: |
          ./scripts/install_build_deps.sh
          python3 -m pip install --upgrade gcovr
      - name: Coverage gate
        run: ./scripts/run_coverage.sh
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v6
        with:
          name: coverage-report
          path: build-coverage/coverage

  sanitizers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: |
          ./scripts/install_build_deps.sh
          sudo apt-get install -y --no-install-recommends clang
      - name: Configure and test ASan/UBSan
        run: |
          cmake -S . -B build-asan -G Ninja -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS='-fsanitize=address,undefined -fno-omit-frame-pointer' -DCMAKE_EXE_LINKER_FLAGS='-fsanitize=address,undefined' -DCMAKE_SHARED_LINKER_FLAGS='-fsanitize=address,undefined'
          cmake --build build-asan --parallel
          ctest --test-dir build-asan --output-on-failure -R 'ExamplesInteropIntegrationTest\..*'

  python-cross-sdk-interop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: |
          ./scripts/install_build_deps.sh
          sudo apt-get install -y --no-install-recommends python3-grpcio python3-grpc-tools
      - name: Run pinned Python cross-SDK interop
        env:
          A2A_PYTHON_REF: main
        run: ./scripts/run_python_cross_sdk_interop.sh


  python-server-cpp-client-interop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: |
          ./scripts/install_build_deps.sh
          sudo apt-get install -y --no-install-recommends python3-grpcio python3-grpc-tools
      - name: Run mixed-runtime interop (Python server -> C++ client)
        env:
          SCENARIO: python-server-cpp-client
        run: ./scripts/run_mixed_runtime_interop.sh

  cpp-server-python-client-interop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: |
          ./scripts/install_build_deps.sh
          sudo apt-get install -y --no-install-recommends python3-grpcio python3-grpc-tools
      - name: Run mixed-runtime interop (C++ server -> Python client)
        env:
          SCENARIO: cpp-server-python-client
        run: ./scripts/run_mixed_runtime_interop.sh

  macos-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - run: |
          brew install cmake ninja protobuf grpc re2 abseil curl
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_PREFIX_PATH="$(brew --prefix);$(brew --prefix curl)"
          cmake --build build --parallel

  windows-build:
    runs-on: windows-2022
    env:
      VCPKG_ROOT: C:/vcpkg
      CI_VCPKG_ROOT: C:/vcpkg
      VCPKG_DEFAULT_TRIPLET: ci-x64-windows-release
      VCPKG_HOST_TRIPLET: ci-x64-windows-release
      VCPKG_OVERLAY_TRIPLETS: ${{ github.workspace }}/triplets
      VCPKG_BINARY_SOURCES: clear;files,C:/vcpkg-binary-cache,readwrite
    steps:
      - uses: actions/checkout@v6

      - name: Restore vcpkg source cache
        uses: actions/cache@v5
        with:
          path: C:/vcpkg
          key: ${{ runner.os }}-vcpkg-tool-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json', 'triplets/ci-x64-windows-release.cmake') }}

      - name: Setup vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path $env:VCPKG_ROOT)) {
            git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
          }
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat"


      - name: Restore vcpkg downloads cache
        uses: actions/cache@v5
        with:
          path: C:/vcpkg/downloads
          key: ${{ runner.os }}-vcpkg-downloads-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-downloads-

      - name: Restore vcpkg binary cache
        uses: actions/cache@v5
        with:
          path: C:/vcpkg-binary-cache
          key: ${{ runner.os }}-vcpkg-bin-${{ env.VCPKG_DEFAULT_TRIPLET }}-${{ hashFiles('**/vcpkg.json', '**/vcpkg-configuration.json', 'triplets/ci-x64-windows-release.cmake') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-bin-${{ env.VCPKG_DEFAULT_TRIPLET }}-

      - name: Install manifest dependencies
        shell: pwsh
        run: |
          $sw = [System.Diagnostics.Stopwatch]::StartNew()
          & "$env:VCPKG_ROOT/vcpkg.exe" install --triplet $env:VCPKG_DEFAULT_TRIPLET --host-triplet $env:VCPKG_HOST_TRIPLET
          $sw.Stop()
          "dependency_install_seconds=$([Math]::Round($sw.Elapsed.TotalSeconds, 2))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "vcpkg_triplet=$env:VCPKG_DEFAULT_TRIPLET" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "vcpkg_host_triplet=$env:VCPKG_HOST_TRIPLET" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        id: deps

      - name: Setup MSVC build environment
        uses: ilammy/msvc-dev-cmd@v1


      - name: Configure and build
        shell: pwsh
        run: |
          $vcpkgRoot = $env:CI_VCPKG_ROOT
          $env:VCPKG_ROOT = $vcpkgRoot
          $toolchain = "$vcpkgRoot/scripts/buildsystems/vcpkg.cmake"
          $targetTriplet = $env:VCPKG_DEFAULT_TRIPLET
          $hostTriplet = $env:VCPKG_HOST_TRIPLET
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 -DCMAKE_TOOLCHAIN_FILE="$toolchain" "-DVCPKG_TARGET_TRIPLET=$targetTriplet" "-DVCPKG_HOST_TRIPLET=$hostTriplet"
          cmake --build build --config RelWithDebInfo --parallel

      - name: Publish Windows stage timings
        shell: pwsh
        run: |
          "## Windows dependency timing" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- vcpkg triplet: ${{ steps.deps.outputs.vcpkg_triplet }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- vcpkg host triplet: ${{ steps.deps.outputs.vcpkg_host_triplet }}" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          "- Install manifest dependencies: ${{ steps.deps.outputs.dependency_install_seconds }}s" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append