name: CMake Consumption

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  cmake-consumer-smoke:
    runs-on: ubuntu-24.04
    env:
      A2A_CPP_GIT_REPOSITORY: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.clone_url || 'https://github.com/MisterVVP/a2a-cpp.git' }}
      A2A_CPP_GIT_TAG: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: ./scripts/install_build_deps.sh
      - name: Configure FetchContent consumer
        run: |
          cmake -S examples/fetch_content_consumer \
            -B build-fetch-content-consumer \
            -DA2A_CPP_GIT_REPOSITORY="$A2A_CPP_GIT_REPOSITORY" \
            -DA2A_CPP_GIT_TAG="$A2A_CPP_GIT_TAG"
      - name: Build FetchContent consumer
        run: cmake --build build-fetch-content-consumer --parallel
      - name: Run FetchContent consumer
        run: ./build-fetch-content-consumer/a2a_cpp_fetch_content_consumer
      - name: Configure SDK install build
        run: |
          cmake -S . -B build-install \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DA2A_ENABLE_TESTING=OFF \
            -DA2A_BUILD_EXAMPLES=OFF \
            -DA2A_BUILD_BENCHMARKS=OFF
      - name: Build SDK install package
        run: cmake --build build-install --parallel
      - name: Install SDK package
        run: cmake --install build-install --prefix "$PWD/a2a-install"
      - name: Create installed-package consumer
        run: |
          mkdir -p build-installed-package-consumer-src
          cat > build-installed-package-consumer-src/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.25)

          project(a2a_cpp_installed_package_consumer LANGUAGES CXX)

          set(CMAKE_CXX_STANDARD 20)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          set(CMAKE_CXX_EXTENSIONS OFF)

          find_package(a2a_cpp CONFIG REQUIRED)

          add_executable(a2a_cpp_installed_package_consumer main.cpp)
          target_link_libraries(a2a_cpp_installed_package_consumer
            PRIVATE
              a2a::client
              a2a::server
              a2a::core
          )
          EOF
          cat > build-installed-package-consumer-src/main.cpp <<'EOF'
          #include "a2a/core/version.h"

          int main() { return a2a::core::Version::HeaderValue().empty() ? 1 : 0; }
          EOF
      - name: Configure installed-package consumer
        run: |
          cmake -S build-installed-package-consumer-src \
            -B build-installed-package-consumer \
            -DCMAKE_PREFIX_PATH="$PWD/a2a-install"
      - name: Build installed-package consumer
        run: cmake --build build-installed-package-consumer --parallel
      - name: Run installed-package consumer
        run: ./build-installed-package-consumer/a2a_cpp_installed_package_consumer
