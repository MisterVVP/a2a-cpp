name: CMake Package

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  package-consumer-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install deps
        run: ./scripts/install_build_deps.sh
      - name: Configure package build
        run: |
          cmake -S . -B build-package \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DA2A_ENABLE_TESTING=OFF \
            -DA2A_BUILD_EXAMPLES=OFF \
            -DA2A_BUILD_BENCHMARKS=OFF
      - name: Build package
        run: cmake --build build-package --parallel
      - name: Install package
        run: cmake --install build-package --prefix "$PWD/a2a-install"
      - name: Configure installed-package consumer
        run: |
          cmake -S examples/cmake_package_consumer \
            -B build-package-consumer \
            -DCMAKE_PREFIX_PATH="$PWD/a2a-install"
      - name: Build installed-package consumer
        run: cmake --build build-package-consumer --parallel
      - name: Run installed-package consumer
        run: ./build-package-consumer/a2a_cpp_package_consumer
