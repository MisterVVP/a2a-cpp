name: TCK Conformance

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  TCK_REPO: a2aproject/a2a-tck
  TCK_REF: main
  TCK_WORKDIR: tck-repo
  TCK_REPORT_DIR: tck-artifacts/reports
  TCK_LOG_DIR: tck-artifacts/logs
  SUT_HOST: 127.0.0.1
  SUT_PORT: "50061"
  A2A_TCK_POSTGRES_DSN: postgresql://a2a:a2a@127.0.0.1:5432/a2a
  A2A_TCK_POSTGRES_SCHEMA: tck_postgres

jobs:
  mandatory-conformance:
    name: mandatory-conformance
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: a2a
          POSTGRES_PASSWORD: a2a
          POSTGRES_DB: a2a
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U a2a -d a2a"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          ./scripts/install_build_deps.sh
          sudo apt-get install -y --no-install-recommends libpq-dev netcat-openbsd jq python3-venv nodejs npm postgresql-client

      - name: Checkout TCK
        uses: actions/checkout@v6
        with:
          repository: ${{ env.TCK_REPO }}
          ref: ${{ env.TCK_REF }}
          path: ${{ env.TCK_WORKDIR }}

      - name: Start deterministic SUT with in-memory store
        env:
          A2A_TCK_STORE_BACKEND: inmemory
          SUT_LOG_FILE: build-tck/tck-sut-inmemory.log
        run: ./scripts/run_tck_sut.sh

      - name: Run mandatory TCK category with in-memory store
        continue-on-error: true
        env:
          TCK_SUT_ENDPOINT: ${{ env.SUT_HOST }}:${{ env.SUT_PORT }}
          TCK_SUT_URL: http://${{ env.SUT_HOST }}:${{ env.SUT_PORT }}
          TCK_RUN_CMD: ${{ vars.TCK_RUN_CMD }}
          TCK_TRANSPORTS: grpc,jsonrpc,http_json
          TCK_REPORT_DIR: tck-artifacts/reports/inmemory
          TCK_LOG_DIR: tck-artifacts/logs/inmemory
        run: ./scripts/run_tck_mandatory.sh

      - name: Summarize in-memory TCK report gaps
        if: always()
        run: |
          report=tck-artifacts/reports/inmemory/compatibility.json
          if [[ -f "${report}" ]]; then
            python3 scripts/summarize_tck_report.py "${report}"
          else
            echo "No in-memory compatibility report was generated."
          fi

      - name: Stop deterministic in-memory SUT
        if: always()
        run: ./scripts/stop_tck_sut.sh

      - name: Start deterministic SUT with PostgreSQL store
        env:
          A2A_TCK_STORE_BACKEND: postgres
          SUT_LOG_FILE: build-tck/tck-sut-postgres.log
        run: ./scripts/run_tck_sut.sh

      - name: Run mandatory TCK category with PostgreSQL store
        continue-on-error: true
        env:
          TCK_SUT_ENDPOINT: ${{ env.SUT_HOST }}:${{ env.SUT_PORT }}
          TCK_SUT_URL: http://${{ env.SUT_HOST }}:${{ env.SUT_PORT }}
          TCK_RUN_CMD: ${{ vars.TCK_RUN_CMD }}
          TCK_TRANSPORTS: grpc,jsonrpc,http_json
          TCK_REPORT_DIR: tck-artifacts/reports/postgres
          TCK_LOG_DIR: tck-artifacts/logs/postgres
        run: ./scripts/run_tck_mandatory.sh

      - name: Summarize PostgreSQL TCK report gaps
        if: always()
        run: |
          report=tck-artifacts/reports/postgres/compatibility.json
          if [[ -f "${report}" ]]; then
            python3 scripts/summarize_tck_report.py "${report}"
          else
            echo "No PostgreSQL compatibility report was generated."
          fi

      - name: Stop deterministic PostgreSQL SUT
        if: always()
        run: ./scripts/stop_tck_sut.sh

      - name: Capture runner diagnostics
        if: always()
        run: |
          mkdir -p "${TCK_LOG_DIR}"
          cp /etc/os-release "${TCK_LOG_DIR}/os-release.txt"
          uname -a > "${TCK_LOG_DIR}/uname.txt"
          cmake --version > "${TCK_LOG_DIR}/cmake-version.txt"
          pg_isready -h 127.0.0.1 -p 5432 -U a2a -d a2a > "${TCK_LOG_DIR}/postgres-ready.txt" 2>&1 || true

      - name: Upload TCK artifacts
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: tck-mandatory-artifacts
          path: |
            ${{ env.TCK_REPORT_DIR }}
            ${{ env.TCK_LOG_DIR }}
            build-tck/tck-sut-inmemory.log
            build-tck/tck-sut-postgres.log
          if-no-files-found: warn

      - name: Verify TCK reports were generated
        if: always()
        run: |
          missing_reports=0
          for backend in inmemory postgres; do
            report="tck-artifacts/reports/${backend}/compatibility.json"
            if [[ ! -f "${report}" ]]; then
              echo "Missing required TCK report: ${report}"
              missing_reports=1
            fi
          done
          exit "${missing_reports}"
