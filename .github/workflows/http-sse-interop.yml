name: HTTP SSE Interoperability

on:
  pull_request:
    paths:
      - '.github/workflows/http-sse-interop.yml'
      - 'include/a2a/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/run_http_sse_interop.sh'
      - 'scripts/interop/python_http_sse_fixture.py'
      - 'CMakeLists.txt'
  push:
    branches: [main]
    paths:
      - '.github/workflows/http-sse-interop.yml'
      - 'include/a2a/**'
      - 'src/**'
      - 'tests/**'
      - 'scripts/run_http_sse_interop.sh'
      - 'scripts/interop/python_http_sse_fixture.py'
      - 'CMakeLists.txt'

jobs:
  python-http-sse-server-cpp-client-interop:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Install dependencies
        run: ./scripts/install_build_deps.sh
      - name: Run HTTP SSE interoperability fixtures
        run: ./scripts/run_http_sse_interop.sh
      - name: Upload fixture logs
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: http-sse-interop-logs
          path: build-http-sse-interop/fixture-*.log
          if-no-files-found: ignore
