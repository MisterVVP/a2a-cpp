name: Capture PR150 Fixture Diagnostic

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  capture:
    if: github.head_ref == 'automation/pr149-remaining-sse-gaps-patch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/pr149-remaining-sse-gaps-patch
      - name: Install dependencies
        run: ./scripts/install_build_deps.sh
      - name: Capture fixture failure
        run: |
          set +e
          bash ./scripts/run_http_sse_interop.sh > pr150_fixture_diagnostic.txt 2>&1
          status=$?
          echo "exit_status=${status}" >> pr150_fixture_diagnostic.txt
          tail -n 250 pr150_fixture_diagnostic.txt > pr150_fixture_diagnostic.tail
          mv pr150_fixture_diagnostic.tail pr150_fixture_diagnostic.txt
          exit 0
      - name: Commit diagnostic and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/capture-pr150-fixture-diagnostic.yml
          git add -A
          git commit -m "Capture final PR150 fixture diagnostic"
          git push
