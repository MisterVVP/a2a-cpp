name: Capture PR150 SUT diagnostic

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  capture:
    if: github.head_ref == 'automation/pr149-remaining-sse-gaps-patch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: automation/pr149-remaining-sse-gaps-patch
          fetch-depth: 0
      - name: Install dependencies
        run: ./scripts/install_build_deps.sh
      - name: Build interop clients
        run: bash ./scripts/run_http_sse_interop.sh
      - name: Capture SUT failure
        shell: bash
        run: |
          set +e
          bash ./scripts/run_cpp_sut_streaming_functional.sh > /tmp/pr150-sut.log 2>&1
          status=$?
          tail -n 200 /tmp/pr150-sut.log > pr150_sut_diagnostic.txt
          echo "exit_status=${status}" >> pr150_sut_diagnostic.txt
          exit 0
      - name: Commit diagnostic and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/capture-pr150-sut-diagnostic.yml
          git add pr150_sut_diagnostic.txt
          git commit -m "Capture PR150 C++ SUT diagnostic"
          git push
