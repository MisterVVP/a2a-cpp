[book]
title = "a2a-cpp Documentation"
authors = ["a2a-cpp contributors"]
description = "Documentation for the a2a-cpp C++20 SDK implementing the Agent2Agent (A2A) protocol."
language = "en"
src = "src"

[build]
build-dir = "../book-build"

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/MisterVVP/a2a-cpp"
edit-url-template = "https://github.com/MisterVVP/a2a-cpp/edit/main/book/{path}"
